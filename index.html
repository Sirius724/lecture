<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveClass Interact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- WebRTC 실시간 연속 음성 스트리밍 라이브러리 -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: 'Pretendard', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .selectable-text { user-select: text !important; -webkit-user-select: text !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col" onclick="resumeAudio()">

  <!-- 청중 수신용 숨김 오디오 플레이어 -->
  <audio id="remoteAudioPlayer" autoplay playsinline></audio>

  <!-- 상단 네비게이션 -->
  <header class="bg-slate-900/90 border-b border-slate-800 px-6 py-3 flex items-center justify-between sticky top-0 z-40 backdrop-blur">
    <div class="flex items-center space-x-3">
      <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
      <h1 class="text-lg font-extrabold tracking-tight bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">LiveClass Interact</h1>
      <span id="roleBadge" class="text-xs px-2.5 py-1 rounded-full font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">청중 모드</span>
      
      <!-- 실시간 마이크 수신 상태 -->
      <span id="micStatusBadge" class="text-[11px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700 flex items-center space-x-1">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-500" id="micStatusDot"></span>
        <span id="micStatusText">강사 마이크 대기 중</span>
      </span>
    </div>

    <div class="flex items-center space-x-3">
      <!-- 닉네임 설정 -->
      <div class="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
        <span class="text-xs text-slate-400 font-medium">닉네임:</span>
        <input id="userNameInput" type="text" value="참여자" class="bg-transparent text-xs text-sky-400 font-bold focus:outline-none w-20">
      </div>

      <!-- 모드 전환 버튼 -->
      <button id="modeSwitchBtn" onclick="handleModeSwitch()" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition flex items-center space-x-1.5 bg-amber-500/10 text-amber-400 border-amber-500/30 hover:bg-amber-500/20">
        <span id="lockIcon">🔒</span>
        <span id="modeBtnText">강사 모드 전환</span>
      </button>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    
    <!-- 좌측: 화면 공유 및 공지/커맨드 영역 -->
    <div class="flex-1 flex flex-col p-4 lg:p-6 overflow-y-auto space-y-4">
      
      <!-- 1. 커맨드 & 공지 뷰어 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <span class="px-2.5 py-1 rounded bg-indigo-500/20 text-indigo-400 text-xs font-bold border border-indigo-500/30" id="noticeTypeBadge">📌 실시간 지침</span>
            <span class="text-xs text-slate-400" id="noticeTimeText">대기 중</span>
          </div>
          <!-- 원클릭 복사 버튼 -->
          <button id="copyCommandBtn" onclick="copyCurrentCommand()" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-sky-500 hover:bg-sky-400 text-white transition flex items-center space-x-1.5 shadow-md shadow-sky-500/20">
            <span>📋 복사하기</span>
          </button>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-sm text-sky-300 selectable-text break-all">
          <pre id="commandText" class="whitespace-pre-wrap">강의가 준비 중입니다. 강사의 지침을 기다려주세요.</pre>
        </div>
      </div>

      <!-- 2. 강사 전용 컨트롤 패널 -->
      <div id="hostControlPanel" class="hidden bg-slate-900/90 border border-amber-500/30 rounded-2xl p-5 shadow-xl space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
          <h2 class="text-sm font-bold text-amber-400 flex items-center space-x-2">
            <span>⚙️ 강사 전용 컨트롤 패널</span>
          </h2>
          
          <div class="flex flex-wrap items-center gap-2">
            <!-- 연속 마이크 스트리밍 ON/OFF 토글 버튼 -->
            <button id="masterMicBtn" onclick="toggleContinuousMic()" class="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow-md shadow-rose-600/30">
              <span id="micBtnIcon">🎙️</span>
              <span id="micBtnText">마이크 켜기 (연속 송출)</span>
            </button>

            <span class="text-slate-700">|</span>

            <button onclick="startScreenShare()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition">🖥️ 화면 공유</button>
            <button onclick="stopScreenShare()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold transition">중지</button>
            <button id="webcamToggleBtn" onclick="toggleWebcam()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition">📷 웹캠</button>
          </div>
        </div>

        <!-- 커맨드 발행창 -->
        <div class="space-y-2">
          <label class="text-xs text-slate-300 font-semibold">청중에게 보낼 커맨드/공지사항 작성</label>
          <div class="flex gap-2">
            <input id="hostNoticeInput" type="text" placeholder="예: git clone https://... 또는 터미널 명령어 입력" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs focus:outline-none focus:border-amber-500">
            <button onclick="publishNotice()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition">발행하기</button>
          </div>
        </div>
      </div>

      <!-- 3. 화면 공유 및 강사 웹캠 뷰포트 -->
      <div class="relative bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden aspect-video flex items-center justify-center shadow-2xl">
        <video id="screenVideo" autoplay playsinline class="w-full h-full object-contain hidden"></video>
        
        <div id="screenPlaceholder" class="text-center p-6 space-y-2">
          <div class="text-4xl text-slate-600">🖥️</div>
          <p class="text-sm font-semibold text-slate-400">강의 화면이 대기 상태입니다.</p>
          <p class="text-xs text-slate-600">강사가 화면 공유를 시작하면 여기에 자동으로 표시됩니다.</p>
        </div>

        <div id="webcamContainer" class="hidden absolute bottom-4 right-4 w-44 md:w-56 aspect-video rounded-xl overflow-hidden border-2 border-emerald-500/80 shadow-2xl bg-slate-900 z-20 transition-all">
          <video id="webcamVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
          <div class="absolute top-1.5 left-2 px-1.5 py-0.5 rounded bg-black/60 backdrop-blur text-[10px] text-emerald-400 font-bold">강사 캠</div>
        </div>
      </div>

    </div>

    <!-- 우측: 실시간 채팅 영역 -->
    <div class="w-full lg:w-96 bg-slate-900 border-t lg:border-t-0 lg:border-l border-slate-800 flex flex-col h-[500px] lg:h-auto">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-200">실시간 채팅</h2>
        <span class="text-xs text-emerald-400 font-medium">● Firebase 연결됨</span>
      </div>

      <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3">
        <div class="bg-slate-800/50 rounded-xl p-3 border border-slate-800">
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs font-bold text-sky-400">시스템</span>
            <span class="text-[10px] text-slate-500">안내</span>
          </div>
          <p class="text-xs text-slate-300">채팅창에 입장하였습니다. 강사의 마이크 음성은 실시간으로 자동 출력됩니다.</p>
        </div>
      </div>

      <div class="p-3 border-t border-slate-800 bg-slate-900/50">
        <form id="chatForm" class="flex gap-2">
          <input id="chatInput" type="text" placeholder="메시지를 입력하세요..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-sky-500">
          <button type="submit" class="px-3.5 py-2 bg-sky-500 hover:bg-sky-400 text-white rounded-xl text-xs font-bold transition">전송</button>
        </form>
      </div>
    </div>

  </main>

  <!-- 1. Firebase 실시간 지침 및 채팅 동기화 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      doc, 
      setDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      limit, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAg2HtVa26rr7t03Ao6MLgZq6tJBUh20p0",
      authDomain: "liveclass-lecture.firebaseapp.com",
      projectId: "liveclass-lecture",
      storageBucket: "liveclass-lecture.firebasestorage.app",
      messagingSenderId: "708172392387",
      appId: "1:708172392387:web:aa63baa38dbe93e57abf76"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const noticeDocRef = doc(db, "live_session", "current_notice");

    onSnapshot(noticeDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        document.getElementById('commandText').textContent = data.text || "강사의 지침을 기다려주세요.";
        if (data.time) {
          document.getElementById('noticeTimeText').textContent = data.time;
        }
      }
    });

    window.publishNotice = async function() {
      const input = document.getElementById('hostNoticeInput');
      const text = input.value.trim();
      if (!text) return;

      try {
        await setDoc(noticeDocRef, {
          text: text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          updatedAt: serverTimestamp()
        });
        input.value = '';
      } catch (err) {
        console.error("공지 저장 실패:", err);
      }
    };

    const messagesColRef = collection(db, "chat_messages");
    const chatQuery = query(messagesColRef, orderBy("createdAt", "asc"), limit(100));

    onSnapshot(chatQuery, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          appendMessage(change.doc.data());
        }
      });
    });

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      const user = document.getElementById('userNameInput').value.trim() || '참여자';

      if (!text) return;

      try {
        await addDoc(messagesColRef, {
          user: user,
          text: text,
          isHost: window.isHost || false,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          createdAt: serverTimestamp()
        });
        input.value = '';
      } catch (err) {
        console.error("채팅 전송 실패:", err);
      }
    });

    function appendMessage(data) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = "bg-slate-800/40 rounded-xl p-3 border border-slate-800/80";
      
      div.innerHTML = `
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-bold ${data.isHost ? 'text-amber-400' : 'text-sky-400'}">${escapeHtml(data.user)} ${data.isHost ? '👑' : ''}</span>
          <span class="text-[10px] text-slate-500">${data.time || ''}</span>
        </div>
        <p class="text-xs text-slate-200 selectable-text">${escapeHtml(data.text)}</p>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s]);
    }
  </script>

  <!-- 2. WebRTC (PeerJS) 연속 음성 스트리밍 엔진 -->
  <script>
    // 강사 전용 고유 룸 ID (sirius724 전용)
    const HOST_PEER_ID = "liveclass-audio-sirius724";

    let peer = null;
    let liveAudioStream = null;
    let isMicActive = false;
    let connectedAudienceCalls = [];

    // 청중 모드일 때 강사에게 자동 연결
    function initAudienceAudioReceiver() {
      if (peer) peer.destroy();

      peer = new Peer(); // 청중은 랜덤 ID 발급

      peer.on('open', (id) => {
        connectToHostAudio();
      });

      // 강사가 음성 스트림을 보냈을 때 수신
      peer.on('call', (call) => {
        call.answer(); // 무응답 수신 (청중 마이크는 보내지 않음)
        call.on('stream', (stream) => {
          const audioPlayer = document.getElementById('remoteAudioPlayer');
          audioPlayer.srcObject = stream;
          audioPlayer.play().catch(e => console.log("자동재생 권한 대기"));
          
          updateMicStatus(true, "강사 음성 라이브 수신 중 🟢");
        });
      });

      peer.on('error', (err) => {
        // 강사가 아직 연결되지 않았을 때 재시도
        setTimeout(connectToHostAudio, 5000);
      });
    }

    function connectToHostAudio() {
      if (!peer || window.isHost) return;
      const conn = peer.connect(HOST_PEER_ID);
      conn.on('open', () => {
        updateMicStatus(false, "강사 오디오 룸 연결됨");
      });
    }

    // 화면 클릭 시 브라우저 오디오 재생 잠금 해제
    window.resumeAudio = function() {
      const audioPlayer = document.getElementById('remoteAudioPlayer');
      if (audioPlayer && audioPlayer.srcObject && audioPlayer.paused) {
        audioPlayer.play();
      }
    };

    function updateMicStatus(isLive, text) {
      const badge = document.getElementById('micStatusBadge');
      const dot = document.getElementById('micStatusDot');
      const label = document.getElementById('micStatusText');
      label.textContent = text;

      if (isLive) {
        badge.className = "text-[11px] px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center space-x-1 animate-pulse";
        dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400";
      } else {
        badge.className = "text-[11px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700 flex items-center space-x-1";
        dot.className = "w-1.5 h-1.5 rounded-full bg-slate-500";
      }
    }

    // ==========================================
    // 강사 전용: 마이크 연속 스트리밍 토글
    // ==========================================
    async function toggleContinuousMic() {
      if (isMicActive) {
        stopContinuousMic();
      } else {
        await startContinuousMic();
      }
    }

    async function startContinuousMic() {
      try {
        // 마이크 스트림 획득 (노이즈 캔슬링 및 에코 제거 포함)
        liveAudioStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });

        isMicActive = true;
        updateHostMicUI(true);

        // 강사 Peer 초기화 및 접속 대기
        if (!peer || peer.id !== HOST_PEER_ID) {
          if (peer) peer.destroy();
          peer = new Peer(HOST_PEER_ID);

          peer.on('connection', (conn) => {
            // 새 청중이 접속하면 마이크 스트림 전송
            if (liveAudioStream && isMicActive) {
              const call = peer.call(conn.peer, liveAudioStream);
              connectedAudienceCalls.push(call);
            }
          });
        }

        // 이미 연결되어 있던 청중들에게 스트림 전송
        updateMicStatus(true, "마이크 송출 중 (ON) 🔴");

      } catch (err) {
        console.error("마이크 접근 오류:", err);
        alert("마이크 사용 권한을 허용해주세요.");
      }
    }

    function stopContinuousMic() {
      if (liveAudioStream) {
        // 음성 트랙 종료 (완전한 음소거)
        liveAudioStream.getTracks().forEach(t => t.stop());
        liveAudioStream = null;
      }
      isMicActive = false;
      updateHostMicUI(false);
      updateMicStatus(false, "마이크 꺼짐 (OFF)");
    }

    function updateHostMicUI(active) {
      const btn = document.getElementById('masterMicBtn');
      const icon = document.getElementById('micBtnIcon');
      const text = document.getElementById('micBtnText');

      if (active) {
        btn.classList.replace('bg-rose-600', 'bg-emerald-600');
        btn.classList.replace('hover:bg-rose-500', 'hover:bg-emerald-500');
        btn.classList.add('animate-pulse');
        icon.textContent = "🛑";
        text.textContent = "마이크 끄기 (송출 중)";
      } else {
        btn.classList.replace('bg-emerald-600', 'bg-rose-600');
        btn.classList.replace('hover:bg-emerald-500', 'hover:bg-rose-500');
        btn.classList.remove('animate-pulse');
        icon.textContent = "🎙️";
        text.textContent = "마이크 켜기 (연속 송출)";
      }
    }

    // ==========================================
    // 강사 인증 및 기본 제어 로직
    // ==========================================
    const HOST_PASSWORD_HASH = "257c3c6176d1322a78c4563f14f6d2927bf8e894b88307239933e5290cafea98";
    window.isHost = false;
    let screenStream = null;
    let webcamStream = null;

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleModeSwitch() {
      if (window.isHost) {
        if (confirm("청중 모드로 전환하시겠습니까?")) {
          window.isHost = false;
          stopContinuousMic();
          stopWebcam();
          stopScreenShare();
          updateUIMode();
          initAudienceAudioReceiver();
        }
        return;
      }

      const inputPassword = prompt("강사 모드 비밀번호를 입력하세요:");
      if (!inputPassword) return;

      const inputHash = await sha256(inputPassword);

      if (inputHash === HOST_PASSWORD_HASH) {
        alert("강사 인증이 완료되었습니다.");
        window.isHost = true;
        updateUIMode();
        // 강사 모드로 전환 시 수신자 Peer 정리
        if (peer) peer.destroy();
        peer = new Peer(HOST_PEER_ID);
        peer.on('connection', (conn) => {
          if (liveAudioStream && isMicActive) {
            peer.call(conn.peer, liveAudioStream);
          }
        });
      } else {
        alert("비밀번호가 일치하지 않습니다.");
      }
    }

    function updateUIMode() {
      const badge = document.getElementById('roleBadge');
      const btnText = document.getElementById('modeBtnText');
      const lockIcon = document.getElementById('lockIcon');
      const hostPanel = document.getElementById('hostControlPanel');

      if (window.isHost) {
        badge.textContent = "강사 모드";
        badge.className = "text-xs px-2.5 py-1 rounded-full font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30";
        btnText.textContent = "청중 모드로 전환";
        lockIcon.textContent = "🔓";
        hostPanel.classList.remove('hidden');
      } else {
        badge.textContent = "청중 모드";
        badge.className = "text-xs px-2.5 py-1 rounded-full font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        btnText.textContent = "강사 모드 전환";
        lockIcon.textContent = "🔒";
        hostPanel.classList.add('hidden');
      }
    }

    function copyCurrentCommand() {
      const text = document.getElementById('commandText').textContent;
      const btn = document.getElementById('copyCommandBtn');

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }

      function fallbackCopy() {
        const temp = document.createElement('textarea');
        temp.value = text;
        temp.style.position = 'fixed';
        temp.style.opacity = '0';
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showCopied();
      }

      function showCopied() {
        btn.innerHTML = `<span>✔ 복사 완료!</span>`;
        btn.classList.replace('bg-sky-500', 'bg-emerald-500');
        setTimeout(() => {
          btn.innerHTML = `<span>📋 복사하기</span>`;
          btn.classList.replace('bg-emerald-500', 'bg-sky-500');
        }, 2000);
      }
    }

    async function startScreenShare() {
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        const video = document.getElementById('screenVideo');
        video.srcObject = screenStream;
        video.classList.remove('hidden');
        document.getElementById('screenPlaceholder').classList.add('hidden');

        screenStream.getVideoTracks()[0].onended = () => {
          stopScreenShare();
        };
      } catch (err) {
        console.error("화면 공유 오류:", err);
      }
    }

    function stopScreenShare() {
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
      }
      const video = document.getElementById('screenVideo');
      video.srcObject = null;
      video.classList.add('hidden');
      document.getElementById('screenPlaceholder').classList.remove('hidden');
    }

    async function toggleWebcam() {
      if (webcamStream) {
        stopWebcam();
      } else {
        await startWebcam();
      }
    }

    async function startWebcam() {
      try {
        webcamStream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 640 }, height: { ideal: 360 } }, 
          audio: false 
        });
        const webcamVideo = document.getElementById('webcamVideo');
        webcamVideo.srcObject = webcamStream;
        document.getElementById('webcamContainer').classList.remove('hidden');

        const btn = document.getElementById('webcamToggleBtn');
        btn.textContent = "🛑 캠 끄기";
        btn.classList.replace('bg-emerald-600', 'bg-rose-600');
      } catch (err) {
        console.error("웹캠 접근 오류:", err);
      }
    }

    function stopWebcam() {
      if (webcamStream) {
        webcamStream.getTracks().forEach(track => track.stop());
        webcamStream = null;
      }
      const webcamVideo = document.getElementById('webcamVideo');
      webcamVideo.srcObject = null;
      document.getElementById('webcamContainer').classList.add('hidden');

      const btn = document.getElementById('webcamToggleBtn');
      if (btn) {
        btn.textContent = "📷 웹캠";
        btn.classList.replace('bg-rose-600', 'bg-emerald-600');
      }
    }

    // 청중 모드로 접속 시 즉시 오디오 수신 리스너 초기화
    window.addEventListener('DOMContentLoaded', () => {
      initAudienceAudioReceiver();
    });
  </script>
</body>
</html>
